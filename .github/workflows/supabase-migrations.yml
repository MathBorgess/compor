name: Supabase migrations

on:
  push:
    branches: [main]
    paths:
      - 'supabase/migrations/**'
  workflow_dispatch:

permissions:
  contents: read

# One production target. Queue rather than cancel migrations in progress.
# Each run checks out current main after entering the group, so a delayed run
# cannot apply an older snapshot after a newer one.
concurrency:
  group: compor-supabase-production-migrations
  cancel-in-progress: false
  queue: max

jobs:
  preflight:
    name: Confirm migration automation is enabled
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Require main and the reviewed production baseline
        env:
          MIGRATIONS_READY: ${{ vars.SUPABASE_MIGRATIONS_ENABLED }}
          PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
          VERIFIED_PROJECT_REF: ${{ vars.SUPABASE_MIGRATIONS_VERIFIED_PROJECT_REF }}
        run: |
          set -eu
          if [ "$GITHUB_REF" != 'refs/heads/main' ]; then
            echo '::error::Executar apenas na branch main.'
            exit 1
          fi
          if [ "$MIGRATIONS_READY" != 'true' ]; then
            echo '::error::Automação desativada: identifique o projeto e verifique o histórico e o esquema de produção antes de habilitar.'
            exit 1
          fi
          if ! printf '%s' "$PROJECT_REF" | grep -Eq '^[a-z0-9]{20}$' || [ "$PROJECT_REF" != "$VERIFIED_PROJECT_REF" ]; then
            echo '::error::O projeto não corresponde ao projeto verificado.'
            exit 1
          fi
          # A queued run must not follow an uncertain failed deployment until it
          # has been inspected. The persistent guard is not implemented yet.
          echo '::error::Automação bloqueada: falta uma trava durável após falha ou cancelamento incerto.'
          exit 1

  migrate:
    name: Apply pending migrations
    needs: preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: production
    steps:
      - name: Check out current main
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v4.2.2
        with:
          ref: refs/heads/main
          persist-credentials: false

      - name: Record migration source commit
        run: git rev-parse HEAD

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@689adcfb80d947100a1eab127289b97d1fb07b13 # v3.2.0
        with:
          version: 2.84.2

      - name: Link verified project and apply pending migrations
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
          VERIFIED_PROJECT_REF: ${{ vars.SUPABASE_MIGRATIONS_VERIFIED_PROJECT_REF }}
        run: |
          set -eu
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SUPABASE_DB_PASSWORD" ]; then
            echo '::error::Secrets de acesso Supabase ausentes no ambiente production.'
            exit 1
          fi
          if ! printf '%s' "$SUPABASE_PROJECT_REF" | grep -Eq '^[a-z0-9]{20}$' || [ "$SUPABASE_PROJECT_REF" != "$VERIFIED_PROJECT_REF" ]; then
            echo '::error::Configure SUPABASE_PROJECT_REF com o projeto de produção verificado.'
            exit 1
          fi
          umask 077
          ca_file=$(mktemp "$RUNNER_TEMP/compor-ca.XXXXXXXX")
          workdir=$(mktemp -d "$RUNNER_TEMP/compor-migrations.XXXXXXXX")
          trap 'rm -f "$ca_file"; rm -rf "$workdir"' EXIT
          # Canonicalize a single certificate: do not trust additional PEM blocks.
          openssl x509 -in supabase/certs/supabase-root-2021.crt -out "$ca_file" || exit 1
          expected='sha256 Fingerprint=80:70:25:AD:50:D4:ED:21:9D:2C:9C:7D:29:9C:00:4F:82:4E:B0:0C:F7:F6:5A:FE:F6:07:D0:7B:72:E6:CA:FA'
          actual=$(openssl x509 -in "$ca_file" -noout -fingerprint -sha256) || exit 1
          if [ "$actual" != "$expected" ]; then
            echo '::error::Certificado CA ausente ou inesperado; conexão cancelada.'
            exit 1
          fi
          export PGSSLMODE=verify-full
          export PGSSLROOTCERT="$ca_file"
          export PGGSSENCMODE=disable
          # The repository config was generated by a newer CLI. Keep only the
          # reviewed migration bytes and the settings needed for db push.
          if [ -n "$(find supabase/migrations -type l -print -quit)" ]; then
            echo '::error::Migration simbólica não permitida.'
            exit 1
          fi
          mkdir -p "$workdir/supabase"
          cp -R supabase/migrations "$workdir/supabase/migrations"
          diff -rq supabase/migrations "$workdir/supabase/migrations"
          printf 'project_id = "compor"\n[db.migrations]\nenabled = true\n' > "$workdir/supabase/config.toml"
          cd "$workdir"
          supabase link --project-ref "$SUPABASE_PROJECT_REF"
          supabase db push --yes
