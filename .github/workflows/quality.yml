name: Quality

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: '1'
  ASTRO_TELEMETRY_DISABLED: '1'

jobs:
  static:
    name: Static checks
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      web: ${{ steps.areas.outputs.web }}
      unit: ${{ steps.areas.outputs.unit }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Select the areas this change can affect
        id: areas
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        # The selector uses the runner's Node without project dependencies.
        run: |
          node --version
          node scripts/quality/changed-areas.mjs
      - name: Report documentation and agent skill changes
        if: steps.areas.outputs.static_checks == 'false'
        run: echo 'This pull request changes only Markdown in docs/ or at the repository root, or agent skill files.' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        if: steps.areas.outputs.static_checks != 'false'
        with:
          node-version: '24'
          cache: npm
          # Without the site lockfile, Performance can restore this same npm cache.
          cache-dependency-path: |
            package-lock.json
            apps/web/package-lock.json
            ${{ steps.areas.outputs.site != 'false' && 'apps/site/package-lock.json' || '' }}
      - run: npm ci --ignore-scripts
        if: steps.areas.outputs.static_checks != 'false'
        env:
          NPM_CONFIG_TIMING: 'true'
      - run: npm run quality:maintenance
        if: steps.areas.outputs.static_checks != 'false'
      - run: npm run quality:lint
        if: steps.areas.outputs.static_checks != 'false'
      - run: npm ci --ignore-scripts --prefix apps/web
        if: steps.areas.outputs.static_checks != 'false'
      - run: npm run quality:test
        if: steps.areas.outputs.static_checks != 'false'
      - name: Check and build the public site
        if: steps.areas.outputs.site != 'false'
        run: |
          npm ci --ignore-scripts --prefix apps/site
          npm run check --prefix apps/site
          npm run build --prefix apps/site
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always() && steps.areas.outputs.static_checks != 'false'
        with:
          name: maintainability
          path: quality-results/maintainability
          if-no-files-found: warn
          retention-days: 5

  unit:
    name: Contracts and data isolation
    needs: static
    if: needs.static.outputs.unit != 'false'
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            packages/private-images/package-lock.json
            packages/remote-mcp/package-lock.json
            packages/agile-deliberation/package-lock.json
            packages/agents-api/package-lock.json
            prototypes/compor-mcp/package-lock.json
      - run: sudo apt-get update && sudo apt-get install --yes postgresql-client webp python3-pil
      - name: Verify migration and image tools
        run: |
          psql --version
          cwebp -version
          dwebp -version
      - name: Verify migration automation contracts
        run: |
          set -eu
          python3 -c 'import sys; assert sys.version_info[:2] == (3, 12), "Python 3.12 is required"'
          python3 -m venv "$RUNNER_TEMP/compor-migration-tests"
          "$RUNNER_TEMP/compor-migration-tests/bin/python" -I -m pip install \
            --disable-pip-version-check --require-hashes --only-binary=:all: --no-deps \
            -r scripts/requirements-migration-tests.txt
          "$RUNNER_TEMP/compor-migration-tests/bin/python" -I scripts/tests/test_atomic_migration_parser.py
          "$RUNNER_TEMP/compor-migration-tests/bin/python" -I scripts/tests/test_prepare_migration_baseline.py
          "$RUNNER_TEMP/compor-migration-tests/bin/python" -I scripts/tests/test_migration_workflow.py
      - run: npm ci --ignore-scripts --prefix packages/private-images
      - run: npm ci --ignore-scripts --prefix packages/remote-mcp
      - run: npm ci --ignore-scripts --prefix packages/agile-deliberation
      - run: npm ci --ignore-scripts --prefix packages/agents-api
      - run: npm ci --ignore-scripts --prefix prototypes/compor-mcp
      - run: npm run quality:unit
      - name: Verify paired visual evaluation fixtures offline
        env:
          COMPOR_EVAL_PYTHON: /usr/bin/python3
        run: sh scripts/evals/triagem-divergencia/check.sh
      - name: Verify creative evaluation fixtures offline
        env:
          COMPOR_EVAL_PYTHON: /usr/bin/python3
        run: sh scripts/evals/qualidade-criativa/check.sh

  web:
    name: Web types and behavior
    needs: static
    if: needs.static.outputs.web != 'false'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci --ignore-scripts --prefix apps/web
      - run: npm ci --ignore-scripts --prefix packages/remote-mcp
      - run: npm ci --ignore-scripts --prefix packages/agile-deliberation
      - run: npm run quality:typecheck
      - name: Read the Playwright version
        id: playwright
        run: node -p "'version=' + require('./apps/web/package-lock.json').packages['node_modules/playwright-core'].version" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      - name: Install the browser used by tests
        working-directory: apps/web
        run: |
          npx --no-install playwright-core install --no-shell chromium
          node --input-type=module -e "import {chromium} from 'playwright-core'; import {appendFileSync} from 'node:fs'; appendFileSync(process.env.GITHUB_ENV, 'BROWSER_EXECUTABLE_PATH=' + chromium.executablePath() + '\n');"
      - run: npm run quality:browser
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: studio-screenshots
          path: |
            /tmp/compor-entry-*.png
            /tmp/compor-studio-visual-*.png
          if-no-files-found: warn
          retention-days: 5

  performance:
    name: Production performance
    needs: static
    if: needs.static.outputs.web != 'false'
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            apps/web/package-lock.json
      - run: npm ci --ignore-scripts
        env:
          NPM_CONFIG_TIMING: 'true'
      - run: npm ci --ignore-scripts --prefix apps/web
      - name: Read the Playwright version
        id: playwright
        run: node -p "'version=' + require('./apps/web/package-lock.json').packages['node_modules/playwright-core'].version" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      - name: Install the browser used by Lighthouse
        working-directory: apps/web
        run: |
          npx --no-install playwright-core install --no-shell chromium
          node --input-type=module -e "import {chromium} from 'playwright-core'; import {appendFileSync} from 'node:fs'; appendFileSync(process.env.GITHUB_ENV, 'BROWSER_EXECUTABLE_PATH=' + chromium.executablePath() + '\n');"
      - name: Allow the Lighthouse browser to create its sandbox
        shell: bash
        run: |
          chromium_path="$(realpath "$BROWSER_EXECUTABLE_PATH")"
          if [[ ! "$chromium_path" =~ ^/[A-Za-z0-9_./-]+$ ]] || [[ ! -x "$chromium_path" ]]; then
            printf '%s\n' 'Chromium must be an executable with a literal absolute path.' >&2
            exit 1
          fi
          printf 'abi <abi/4.0>,\ninclude <tunables/global>\nprofile compor-lighthouse "%s" flags=(unconfined) {\n  userns,\n}\n' "$chromium_path" | sudo tee /etc/apparmor.d/compor-lighthouse > /dev/null
          sudo apparmor_parser -r /etc/apparmor.d/compor-lighthouse
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: apps/web/.next/cache
          key: next-${{ runner.os }}-${{ hashFiles('apps/web/package-lock.json') }}-${{ github.sha }}
          restore-keys: next-${{ runner.os }}-${{ hashFiles('apps/web/package-lock.json') }}-
      - run: npm run quality:build
      - run: npm run quality:performance
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: production-performance
          path: quality-results/performance
          if-no-files-found: error
          retention-days: 5

  quality:
    name: Quality gate
    if: always()
    needs: [static, unit, web, performance]
    runs-on: ubuntu-slim
    timeout-minutes: 2
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
          sparse-checkout: scripts/quality
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '24'
      - name: Require every check the change can affect to pass
        env:
          CHECKS: ${{ toJSON(needs) }}
        run: node scripts/quality/changed-areas.mjs gate
      - name: Estimate billed minutes
        if: always()
        continue-on-error: true
        timeout-minutes: 1
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/attempts/$GITHUB_RUN_ATTEMPT/jobs?per_page=100" | node scripts/quality/billed-minutes.mjs >> "$GITHUB_STEP_SUMMARY"
